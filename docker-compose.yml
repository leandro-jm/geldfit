name: saude-financeira

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: saude_financeira
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user}
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:-app_worker}
    ports:
      - '${POSTGRES_PORT:-5544}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d saude_financeira']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8026}:8025'
      - '${SMTP_PORT:-1026}:1025'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [whatsapp, full]

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    profiles: [whatsapp, full]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - '${EVOLUTION_PORT:-8085}:8080'
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8085}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: 'false'
    volumes:
      - evolution_instances:/evolution/instances

  migrate:
    image: amacneil/dbmate:2.36
    profiles: [full]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/saude_financeira?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: 'true'
    command: ['--wait', 'up']
    volumes:
      - ./db/migrations:/db/migrations:ro

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: [full]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:-app_user}@postgres:5432/saude_financeira
      FILES_DIR: /data/files
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EVOLUTION_URL: http://evolution:8080
      TRUST_PROXY: uniquelocal
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - '${API_PORT:-4100}:4100'
    volumes:
      - ./data/files:/data/files

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    profiles: [full]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:-app_user}@postgres:5432/saude_financeira
      WORKER_DATABASE_URL: postgresql://app_worker:${APP_WORKER_PASSWORD:-app_worker}@postgres:5432/saude_financeira
      FILES_DIR: /data/files
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EVOLUTION_URL: http://evolution:8080
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes:
      - ./data/files:/data/files

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    profiles: [full]
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '${WEB_PORT:-8090}:80'

volumes:
  pgdata:
  evolution_instances:
